<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Lista de Compras</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Minha Lista de Compras</h1>
        
        <div class="form-group">
            <label for="productInput">Produtos</label>
            <textarea id="productInput" rows="6" placeholder="Cole sua lista aqui, um produto por linha:&#10;4 maçãs&#10;1 arroz&#10;1 bebida zero"></textarea>
            <div class="form-actions">
                <span class="input-hint">O número no início será usado como quantidade.</span>
                <button id="addProductBtn">Adicionar à lista</button>
            </div>
            <div id="addFeedback" class="add-feedback" role="status" aria-live="polite"></div>
        </div>
        
        <div class="list-actions">
            <h2>Lista</h2>
            <button id="clearListBtn" class="clear-list-btn" disabled>Excluir toda a lista</button>
        </div>

        <div class="product-list" id="productList">
            <!-- Os produtos serão inseridos aqui dinamicamente -->
        </div>
        
        <div class="total-section">
            <h3>Total da Compra</h3>
            <div class="total-amount" id="totalAmount">R$ 0,00</div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
